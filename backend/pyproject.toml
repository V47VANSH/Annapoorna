[project]
name = "annapoorna-backend"
version = "1.0.0"
description = "FastAPI backend for Annapoorna: crop disease detection, satellite field reports and multilingual farmer chat."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.8.0",
    "python-dotenv>=1.0.1",
    "pymongo>=4.13.2",
    "chromadb>=0.5.0",
    "langchain-google-genai>=2.1.0",
    "langchain-ollama>=0.3.4",
    "langchain-openai>=0.3.28",
    "earthengine-api>=1.5.24",
    "requests>=2.32.0",
    "scikit-learn>=1.7.1",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    # needs the ffmpeg binary installed (not the "ffmpeg" pip package)
    "openai-whisper>=20240930",
    "apscheduler>=3.11.0",
]

[project.optional-dependencies]
# big install, so optional: uv sync --extra ml
ml = ["tensorflow>=2.16.1"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",  # FastAPI File() defaults
]

[tool.ruff.lint.per-file-ignores]
# trailing spaces are markdown line breaks in the report template
"sattelite_report.py" = ["W291"]
